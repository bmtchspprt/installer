<!-- Version 5 — BST default parts catalog -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BST default parts</title>
<style>
body{margin:0;background:#f4f6f9;color:#14202e;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#14202e;color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px} header p{margin:2px 0 0;color:#b9c4d0;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1px solid #dde3ea;border-radius:16px;padding:14px;text-align:center}
.card svg{width:100%;height:190px}
.card b{display:block;margin-top:6px}
.card code{font-size:12px;color:#6b7a8c}
</style>
</head>
<body>
<header><h1>BST default parts</h1><p>Drawings used across the installer app. Source: bst-parts.js</p></header>
<main id="m"></main>
<script src="bst-parts.js"></script>
<script>
document.getElementById("m").innerHTML = Object.entries(BST_PARTS).map(([id,p])=>
  `<div class="card">${partSVG(id).replace(/width="\d+" height="\d+"/,"")}<b>${p.name}</b><code>img/${id}.svg</code></div>`).join("");
</script>
</body>
</html>
